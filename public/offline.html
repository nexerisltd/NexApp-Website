<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>You're offline — NexApp</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
    background: #2a2e38;
    color: #e7e9ef;
    font-family: system-ui, -apple-system, sans-serif;
    text-align: center;
    padding: 24px;
  }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 20px; margin: 0; }
  p { color: #9198a8; margin: 0; max-width: 320px; font-size: 14px; }
  button {
    margin-top: 8px;
    background: #4d76ff;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
  <img src="/icon-192.png" alt="NexApp" />
  <h1>You're offline</h1>
  <p>NexApp needs a connection to load apps and downloads. Check your network and try again.</p>
  <button onclick="location.reload()">Retry</button>
</body>
</html>
